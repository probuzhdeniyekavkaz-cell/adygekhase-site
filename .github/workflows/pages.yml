name: Обновление сайта

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-video
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Обновить видео из VK Видео
        run: node scripts/refresh-vk-video-cache.mjs
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Поддержать плановые обновления
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"Последнее плановое обновление: %Y-%m-%d-%H" > .github/last-refresh
          git add .github/last-refresh data/vk-videos.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh VK Video feed [skip ci]"
          git push
