name: Обновление сайта

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Поддержать плановые обновления
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"Последнее плановое обновление: %Y-%m" > .github/last-refresh
          if [ -z "$(git status --short -- .github/last-refresh)" ]; then
            exit 0
          fi
          git add .github/last-refresh
          git commit -m "chore: keep scheduled updates active [skip ci]"
          git push
